name: Build Windows Desktop App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Desktop (x64)
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      CMAKE_FLAGS: "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Run Cargo Tests (Native Core Protocols)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Windows App
        run: npx @tauri-apps/cli@2 build

      - name: Upload Windows Executable & Installers
        uses: actions/upload-artifact@v4
        with:
          name: NexusLink-Windows-x64
          path: |
            src-tauri/target/release/nexuslink-desktop.exe
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/**/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundles/nsis/*.exe
            src-tauri/target/release/bundles/nsis/**/*.exe
            src-tauri/target/release/bundles/msi/*.msi
            src-tauri/target/release/bundles/msi/**/*.msi
            src-tauri/target/release/bundles/**/*.exe
            src-tauri/target/release/bundles/**/*.msi
          if-no-files-found: error
