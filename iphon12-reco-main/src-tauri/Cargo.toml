[package]
name = "nexuslink-desktop"
version = "2.4.0"
description = "NexusLink Pro Engine - Low Latency iPhone to PC Link Core"
authors = ["NexusLink Engineering"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
quinn = "0.10"
rcgen = "0.11"
rustls = "0.21"
opus = "0.3"
cpal = "0.15"
ringbuf = "0.3"
parking_lot = "0.12"
tracing = "0.1"
anyhow = "1.0"
mdns-sd = "0.10"
local-ip-address = "0.6.13"
rand = "0.10.2"



[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com"
] }

[features]
default = []
